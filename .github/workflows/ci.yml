name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 校验版本 Tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Tag (${GITHUB_REF_NAME}) 与 package.json 版本 (${version}) 不一致"
            exit 1
          fi
          echo "Tag: ${GITHUB_REF_NAME}"
      - name: 安装 pnpm
        shell: bash
        run: |
          npm install --prefix agent_temp/tools --no-save --ignore-scripts --package-lock=false --no-audit --no-fund --loglevel=error "$(node -p 'require("./package.json").packageManager')"
          export PATH="$GITHUB_WORKSPACE/agent_temp/tools/node_modules/.bin:$PATH"
          echo "$GITHUB_WORKSPACE/agent_temp/tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "pnpm $(pnpm --version)"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: agent_temp/pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 静态检查
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
      - name: Node 测试
        run: pnpm test:node
      - name: UI 测试
        run: pnpm test:ui
      - name: 上传 UI 测试诊断日志
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-diagnostics
          path: agent_temp/ui/**
          if-no-files-found: ignore
          retention-days: 7
      - name: 打包与安装验证
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          rm -rf agent_temp/packages
          pnpm pack --pack-destination agent_temp/packages
          pnpm verify:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref_type == 'tag'
        with:
          name: plugin-package
          path: |
            agent_temp/packages/*.tgz
            agent_temp/packages/*.sha256
          if-no-files-found: error
          retention-days: 14

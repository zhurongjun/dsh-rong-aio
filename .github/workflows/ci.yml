name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      # 用 npm 引导安装，避免旧版自安装器把根包配置误判为多包 workspace。
      - name: 安装固定版本 pnpm
        shell: bash
        run: |
          npm install --prefix agent_temp/tools --no-save --ignore-scripts --package-lock=false --no-audit --no-fund "$(node -p 'require("./package.json").packageManager')"
          echo "$GITHUB_WORKSPACE/agent_temp/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: 安装固定依赖
        run: pnpm install --frozen-lockfile
      - name: 完整检查
        run: pnpm check
      - name: 保留失败的浏览器测试轨迹
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bombadil-traces
          path: agent_temp/bombadil/run-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: 构建
        run: pnpm build
      - name: 打包
        run: pnpm pack --pack-destination agent_temp/packages
      - name: 验证版本、包内容与隔离安装
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: |
            agent_temp/packages/*.tgz
            agent_temp/packages/*.sha256
          if-no-files-found: error
          retention-days: 14

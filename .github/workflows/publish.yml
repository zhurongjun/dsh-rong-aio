name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish-npm:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: plugin-package
          path: agent_temp/packages
      - name: 校验并发布 npm 包
        working-directory: agent_temp/packages
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="dsh-rong-aio-${version}.tgz"
          sha256sum --check "${archive}.sha256"

          # 重跑时核对 npm 上的不可变版本，只有同一份包才继续发布 GitHub Release。
          status=$(curl --silent --show-error --retry 3 --output registry-version.json --write-out '%{http_code}' \
            "${NPM_CONFIG_REGISTRY}/dsh-rong-aio/${version}")
          case "$status" in
            200)
              integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
              if ! jq -e --arg integrity "$integrity" '.dist.integrity == $integrity' registry-version.json > /dev/null; then
                echo "::error::npm 已存在同版本且内容不一致，请使用新版本号。"
                exit 1
              fi
              echo "npm 上已有相同的 dsh-rong-aio@${version}。"
              ;;
            404)
              if [[ "${version%%+*}" == *-* ]]; then
                export NPM_CONFIG_TAG=next
              fi
              npm publish "./${archive}" --access public --registry "$NPM_CONFIG_REGISTRY"
              ;;
            *)
              echo "::error::查询 npm 版本失败（HTTP ${status}）。"
              exit 1
              ;;
          esac

  release:
    needs: publish-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: plugin-package
          path: agent_temp/packages
      - name: 核对附件校验和
        working-directory: agent_temp/packages
        run: sha256sum --check *.sha256
      - name: 上传附件并发布
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent_temp/release
          version="${RELEASE_TAG#v}"
          asset="dsh-rong-aio-${version}.tgz"
          dsh_range="$(tar -xOzf "agent_temp/packages/${asset}" package/package.json | jq -er '.engines.dsh')"
          component_locales="$(tar -tzf "agent_temp/packages/${asset}" | grep -E '^package/lib/components/[^/]+/locale/zh\.json$' | sort)"
          components_md=""
          while IFS= read -r locale_file; do
            [[ -z "$locale_file" ]] && continue
            line="$(tar -xOzf "agent_temp/packages/${asset}" "$locale_file" | jq -er '"- **\(.meta.title)**：\(.meta.description)"')"
            components_md+="${line}"$'\n'
          done <<< "$component_locales"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
          cat > agent_temp/release/notes.md <<EOF
          支持的 DSH 版本范围为 \`${dsh_range}\`，包含以下独立组件：

          ${components_md}
          在 DSH Desktop → 插件 → 添加插件中填写 npm 包名和版本，安装后点击“立即启用”。

          \`\`\`text
          dsh-rong-aio@${version}
          \`\`\`

          Web 安装：

          \`\`\`sh
          dsh plugin --profile web add 'dsh-rong-aio@${version}'
          \`\`\`

          也可在添加插件时粘贴[安装包地址](${url})。附件与 npm 上的预构建包相同。下载 .tgz 及同名 .sha256 文件后，可用 \`sha256sum --check ${asset}.sha256\` 核对完整性。

          [安装与使用说明](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/README.md)
          EOF

          # 失败重跑只允许补全草稿，已经公开的版本及附件不覆盖。
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > agent_temp/release/is-draft.txt; then
            test "$(cat agent_temp/release/is-draft.txt)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file agent_temp/release/notes.md
          fi
          gh release upload "$RELEASE_TAG" "agent_temp/packages/${asset}" "agent_temp/packages/${asset}.sha256" --clobber
          if [[ "$version" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file agent_temp/release/notes.md
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --notes-file agent_temp/release/notes.md
          fi

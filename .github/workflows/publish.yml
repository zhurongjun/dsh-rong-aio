name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish-npm:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: plugin-package
          path: agent_temp/packages
      - name: 校验并发布 npm 包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent_temp
          version="${RELEASE_TAG#v}"
          archive="dsh-rong-aio-${version}.tgz"
          (cd agent_temp/packages && sha256sum --check "${archive}.sha256")

          dist_tag="latest"
          if [[ "${version%%+*}" == *-* ]]; then
            dist_tag="next"
          fi

          status=$(curl --silent --show-error --retry 3 --output agent_temp/npm-registry-version.json --write-out '%{http_code}' \
            "${NPM_CONFIG_REGISTRY}/dsh-rong-aio/${version}")
          case "$status" in
            200)
              integrity="sha512-$(openssl dgst -sha512 -binary "agent_temp/packages/${archive}" | openssl base64 -A)"
              if ! jq -e --arg integrity "$integrity" '.dist.integrity == $integrity' agent_temp/npm-registry-version.json > /dev/null; then
                echo "::error::npm 已存在内容不同的版本：dsh-rong-aio@${version}"
                exit 1
              fi
              echo "npm 已存在一致版本：dsh-rong-aio@${version} (${integrity})"
              ;;
            404)
              npm publish "./agent_temp/packages/${archive}" --access public --tag "$dist_tag" --registry "$NPM_CONFIG_REGISTRY"
              echo "已发布 npm：dsh-rong-aio@${version} (tag: ${dist_tag})"
              ;;
            *)
              echo "::error::查询 npm 注册表失败：dsh-rong-aio@${version} (HTTP ${status})"
              exit 1
              ;;
          esac

  release:
    needs: publish-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: plugin-package
          path: agent_temp/packages
      - name: 上传附件并发布
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent_temp/release
          version="${RELEASE_TAG#v}"
          asset="dsh-rong-aio-${version}.tgz"
          (cd agent_temp/packages && sha256sum --check "${asset}.sha256")

          dsh_range="$(tar -xOzf "agent_temp/packages/${asset}" package/package.json | jq -er '.engines.dsh')"
          component_locales="$(tar -tzf "agent_temp/packages/${asset}" | grep -E '^package/lib/components/[^/]+/locale/zh\.json$' | sort)"
          components_md=""
          while IFS= read -r locale_file; do
            [[ -z "$locale_file" ]] && continue
            line="$(tar -xOzf "agent_temp/packages/${asset}" "$locale_file" | jq -er '"- **\(.meta.title)**：\(.meta.description)"')"
            components_md+="${line}"$'\n'
          done <<< "$component_locales"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"

          cat > agent_temp/release/notes.md <<EOF
          支持的 DSH 版本范围为 \`${dsh_range}\`，包含以下独立组件：

          ${components_md}
          在 DSH Desktop → 插件 → 添加插件中填写 npm 包名和版本，安装后点击“立即启用”。

          \`\`\`text
          dsh-rong-aio@${version}
          \`\`\`

          Web 安装：

          \`\`\`sh
          dsh plugin --profile web add 'dsh-rong-aio@${version}'
          \`\`\`

          也可在添加插件时粘贴[安装包地址](${url})。附件与 npm 上的预构建包相同。下载 .tgz 及同名 .sha256 文件后，可用 \`sha256sum --check ${asset}.sha256\` 核对完整性。

          [安装与使用说明](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/README.md)
          EOF

          if gh release view "$RELEASE_TAG" --json isDraft,url > agent_temp/release/view.json 2> agent_temp/release/view.err; then
            if [[ "$(jq -r '.isDraft' agent_temp/release/view.json)" != true ]]; then
              echo "::error::GitHub Release ${RELEASE_TAG} 已公开 ($(jq -r '.url' agent_temp/release/view.json))，禁止覆盖"
              exit 1
            fi
          elif grep -qi 'release not found' agent_temp/release/view.err; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file agent_temp/release/notes.md
          else
            cat agent_temp/release/view.err >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "agent_temp/packages/${asset}" "agent_temp/packages/${asset}.sha256" --clobber
          if [[ "${version%%+*}" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file agent_temp/release/notes.md
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --notes-file agent_temp/release/notes.md
          fi
          echo "已发布 GitHub Release：$(gh release view "$RELEASE_TAG" --json url --jq .url)"
